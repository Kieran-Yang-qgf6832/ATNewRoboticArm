# 任务层配置：序列由步骤组合而成，新增任务只需编辑本文件，不需要重新编译。
#
# 步骤类型（封闭集合，共 12 类）：
#   wait            不切换控制器状态，纯等待 duration 秒
#   idel            切回 idel 并锁定当前位置
#   reset           复位；只等控制器 current_state 回到 idel
#   joint_move      关节空间轨迹；用 to 引用目标点，或直接给 target
#   joint_console   交互式关节运动；默认终端逐项输入，步骤写 ui: true 时改用 Qt 窗口
#   cart_move       笛卡尔轨迹；offset 为相对当前末端位姿的位移（3 维）
#   pos_move        只把末端移动到基座系绝对位置（to / position），姿态不参与收敛
#   box_move        读取视觉目标面 TF，移动到箱体位姿；4 轴下只控位置、
#                   工具指向由位置经关节 1/2/3 决定（不做工具轴对齐）
#   admittance_move 导纳；**不给 offset = 自由导纳停留**（进导纳、停 duration 秒、回 idel，
#                   外力推着走 / 撤力停下），给 offset = 旧的「导纳下的期望轨迹」
#   tool            末端执行器开关量；action 取下面 tool 段定义的语义名
#   teach           示教；需 duration
#   measure         参数辨识；需 duration
#
# 常用字段：duration（秒）、tolerance（到位容差）。
# reset / joint_console / teach / measure 只能从 idel 进出，执行器会自动先等待控制器空闲。
#
# 当前生效模型是 4 自由度机械臂（src/arm_model/model_4dof），控制器的任务空间是
# **4 维**（参数 task_space_dof=4）：(x, y, z) + joint4 自转角。
#   · 任务层仍然发 6 维位姿（位置 + 旋转向量），由控制器投影：取前 3 维位置，
#     第 4 维自转锁存为载入时的 joint4 实测角，命令姿态的其余分量被丢弃。
#   · 所以 cart_move / pos_move / box_move 的命令姿态都只对 6 轴模型有意义；4 轴下
#     位置是唯一可控量，工具指向由位置经关节 1/2/3 决定。
#   · pos_move 的 to 查 positions 段（3 维坐标），joint_move 的 to 查 points 段（关节角），
#     两者同名但互不相关；pos_move 的 orientation 字段在 4 轴下被忽略。
#   · 工具指向（工具 z 轴方向）不受控：实测 5 cm 平移漂 4–8°、15 cm 平移漂 10–12°。
#     吸盘取放可以接受；需要严格贴面时改用 joint_move。
#   · y 方向工作空间只有约 4 cm 厚（结构限制），|dy| 超过约 2 cm 的目标会被
#     控制器在下发前判为不可达。
#   · 4 轴模型下 admittance / teach_pendant 都可用（docs/bugs.md O22）：导纳的 M/D/K、
#     限速、死区、滤波都按 task_space_dof 取值；不给 offset 时是自由导纳，给 offset 时
#     是「轨迹 + 柔顺」。示教（teach）是零力拖动，靠 kd 阻尼停住。
#
# 各序列的预期结果（2026-10-18 用 4 维任务空间离线复算 + 仿真实测）：
#   正例：reset_only / reset_then_joint / ready_then_cart / pick_demo /
#         cart_cycle_large —— 退出码 0
#   互动序列（需要外力才有意义，见下方注释）：admittance_demo / teach_demo —— 退出码 0
#   反例：reset_then_cart（判据边界）/ unreachable_near（y 方向结构不可达）/
#         unreachable_far（远超工作空间）—— 退出码 1，且**下发前**就被拒绝

# 当前挂载的末端执行器：只影响 tool 步骤的语义名与日志。
# 换夹爪时把 name 改成 gripper、on/off 改成 clamp/release 即可，任务序列不用动。
tool:
  name: suction
  on: suck
  off: release

# 命名目标点：修改一处，所有引用它的序列一起生效。
# 4 自由度模型的目标点（joint1..joint4 关节角，行程见 URDF）：
#   joint1 [-1.5708, 1.5708]  joint2 [-3.1, 3.1]
#   joint3 [-3.14, 3.14]      joint4 [-1.5708, 1.5708]
# 6 自由度时期这三组点是 6 维的，切换到 4 自由度后由前 4 维 / 温和位形重新给出。
#
# ready 已放大到 [0.8, 1.2, -1.2, 0.8]（原来的 [0, 0.3, -0.3, 0] 的约 4 倍，四个关节
# 都动）：末端从 (0.137, 0.027, 0.847) 走到 (-0.078, 0.015, 0.713)。放大前用
# pinocchio + coal 离线校验过整条 0→ready 关节空间路径：连杆间最小距离 0.023 m
# （判据 0.02）、连杆-地面最小净空 0.012 m（判据 0.01）、重力矩最大 1.4 N·m
# （effort 限 50 N·m），均在安全范围内；再往上取 [1.0, 1.5, -1.5, 1.0] 也满足同一组
# 判据，想要更大幅度可以直接改这里。
points:
  home:      [0.0, 0.0,  0.0, 0.0]
  ready:     [0.8, 1.2, -1.2, 0.8]
  above_box: [0.2, 0.4, -0.4, 0.2]
  # 视觉抓取（box_move）的粗定位点：4 轴下要按实际箱体位置用 joint_console 重新摆位，
  # 原 6 轴的 box_pregrasp / box_low_pregrasp 是 6 维关节角，不能直接用。

# 基座系绝对目标点（pos_move 专用，单位：米）。只存 [x, y, z]，与上面 points 的
# 6 维关节角不是一回事。下面两个值由 fk_dump 在 ready 位形实测：
#   translation = [-0.147874210, -0.015724594, 1.232796278]
# 换模型 / 改关节标定 / 改 TF 参考系后必须重测，否则 pos_move 会去错地方。
positions:
  ready_pos:       [-0.147874, -0.015725, 1.232796]
  above_ready_5cm: [-0.147874, -0.015725, 1.282796]
  below_ready_5cm: [-0.147874, -0.015725, 1.182796]

# pos_move 的默认参数。
# max_drift_deg：纯位置模式（没写 orientation）的全姿态漂移告警阈值（度）。
#   只告警、不判失败：姿态本来就不约束，量测是为了让漂移可观测、可回归。
# axis_tolerance_deg：写了 orientation 时工具 z 轴角误差的**硬判据**（度）。
#   必须与控制器 ros2_controller.yaml 的 pos_move_axis_tolerance_deg 保持一致：
#   控制器用它做 IK 收敛，任务层用它做最终验收。
position_move:
  max_drift_deg: 10.0
  axis_tolerance_deg: 1.0

# box_move 的全局默认。
# frame：视觉目标帧名，必须与 /target_face 消息的 child_frame_id 一致；
# tool_offset：link6 +z 到工具尖端的距离（米）。5D 目标位置 = 面心 - tool_offset * 面 z，
#   即工具尖端落在面心；回退到 position-only 时仍用同一个 link6 位置。
# target_timeout：等待 valid 目标的最长时间（秒）。
# max_age：TargetFace 与 TF 时间戳允许的最大年龄（秒）；防止视觉节点卡住时用旧目标。
box_move:
  frame: target_face
  tool_offset: 0.039
  target_timeout: 5.0
  max_age: 0.5

# 交互输入的门禁（joint_console 专用）：超限只提示重输，一个运动指令都不下发。
# 单位是**度**，抄自 arm_model/model/robotic_arm.urdf 的 <limit>（弧度换成度）：
#   换模型时这里必须同步，否则拦的是旧限位。整段可省略 = 不检查。
joint_limits:
  # 单步允许的最大关节变化量；0 = 不限制。
  max_step_deg: 90.0
  joints:
    joint1: {min: -103.1, max: 103.1}   # URDF ±1.8 rad
    joint2: {min: -90.0,  max:  90.0}   # URDF ±1.5708 rad
    joint3: {min: -166.2, max: 166.2}   # URDF ±2.9 rad
    joint4: {min: -114.6, max: 103.1}   # URDF -2.0 .. +1.8 rad
    joint5: {min: -35.0,  max:  35.0}   # URDF ±0.61087 rad
    joint6: {min: -180.0, max: 180.0}   # URDF ±3.14159 rad

sequences:
  # 导纳演示（docs/bugs.md O22）：不带 offset = **自由导纳**。
  #
  # 进入后控制器把「实测力矩 − 模型力矩」的残差当外力，按 M·ẍ + D·ẋ = F 积分成让开运动
  # （K = 0：撤力就停在原地）。速度受 admittance_velocity_limit（0.1 m/s）/ 自转上限
  # （0.5 rad/s）限制，力估计带死区（1.5 N / 0.2 N·m）与一阶低通（10 Hz）。
  #
  # **本序列自身不施力**，不给外力时它只是「进导纳、原地保持 20 s、回 idel」——真实手感
  # 要靠外力脚本，一条命令的验收入口是：
  #   python3 src/launch_pack/tools/admittance_demo_check.py --mode admittance
  # 先 joint_move 到 ready：零位形完全伸直、正好在工作空间边界（+X/-X 都推不动），
  # 在那里测不出「被推着走」。
  admittance_demo:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: admittance_move, duration: 25.0}

  # 拖动示教演示（docs/bugs.md O22）：零力拖动（kp = 0、只留 kd 阻尼 + 重力前馈）。
  # 同样需要外力脚本配合，一条命令的验收入口：
  #   python3 src/launch_pack/tools/admittance_demo_check.py --mode teach
  # 12 s 是给验收入口留的施力/撤力窗口；撤力后靠阻尼停住，不会自己滑出去。
  teach_demo:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      # teach 只能从 idel 进（joint_move 结束后控制器停在 joint_traj 的 STOP 阶段），
      # 所以这里必须显式回一次 idel，否则执行器会以「not in idel before a teach step」失败。
      - {type: idel}
      - {type: teach, duration: 12.0}

  # 最小可用序列：仅复位后回到空闲，用于验证执行器骨架。
  reset_only:
    steps:
      - {type: reset}
      - {type: idel}

  # 复位后运动到 ready 点：纯关节空间，4 轴下稳定可用。
  reset_then_joint:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: idel}

  # **反例（判据边界）**：零位形机械臂完全伸直，处于工作空间边界（雅可比降秩），
  # 从那里直接做笛卡尔运动目标不可达，此处预期失败。
  #
  # 4 维任务空间实测（ik_solve，见下）：零位姿 +X 5 cm 的最近可达位姿仍差
  # **1.526e-3 m**（位置判据 1e-3 m），刚好越过判据。控制器在**下发前**拒绝，
  # 一个运动指令都不下发，退出码 1。
  # 注意这条用例对判据很敏感：位置判据一放宽它就会翻成正例。
  reset_then_cart:
    steps:
      - {type: reset}
      - {type: cart_move, offset: [0.05, 0.0, 0.0], duration: 2.0}
      - {type: idel}

  # 先关节运动到非奇异位形，再做笛卡尔运动。
  #
  # **正例（大幅）**：ready 位姿下 +X **15 cm**（原 5 cm 的 3 倍）。离线按「任务空间
  # 直线 + 每点用上一点做初值」逐点复算：最差残余 2.8e-5 m，相邻点关节跳变最大
  # 0.011 rad，全部点都在关节限位内。工具指向漂约 12.1°——吸盘可以接受，但已接近
  # "不要再加大"的量级（20 cm 时 15.3°）。仿真实测：退出码 0，位置残余 0.0003 m。
  #
  # 仍然要遵守：不要从零位形直接做笛卡尔运动（见上面 reset_then_cart）。
  ready_then_cart:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: cart_move, offset: [0.15, 0.0, 0.0], duration: 3.0}
      - {type: idel}

  # 完整取放示例：吸住后必须等真空建立才能抬升，所以 tool 之后跟一个 wait。
  #
  # **正例（大幅）**：ready 位姿下沿 -Z 下探 **15 cm**（原 5 cm 的 3 倍）。离线逐点
  # 复算最差残余 5.5e-5 m，关节跳变最大 0.030 rad。工具指向在这 15 cm 里漂约 10.2°
  # ——如果以后要贴着平面取放、对姿态敏感，把这一段改成 joint_move。
  # 仿真实测：退出码 0，位置残余 0.0007 m。
  pick_demo:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: tool, action: suck}
      - {type: wait, duration: 1.5}
      - {type: cart_move, offset: [0.0, 0.0, -0.15], duration: 3.0}
      - {type: idel}

  # **正例（大幅、多段）**：一条 4 段的笛卡尔循环，每段 15 cm、总行程 60 cm，
  # 最后回到 ready。用于验证「连续 cart_move 步骤 + 大幅行程」：
  #   ready → +X 15 cm → -Z 15 cm → +Z 15 cm → -X 15 cm → ready
  #
  # 离线逐段复算（任务空间直线 + 每点用上一点做初值）：最差残余 5.2e-5 m，
  # 单段相邻点关节跳变最大 0.029 rad，终点与 ready 的位置偏差 < 1e-4 m、
  # 工具指向偏差 0.01°（因为整圈回到原点）。单段工具指向最多漂约 12°。
  # 仿真实测：退出码 0，最后一段位置残余 0.0002 m，全程无 IK 失败/安全保持。
  #
  # 注意每段都是独立的 cart_move 步骤：控制器保持在 cart_traj 的 STOP 阶段，
  # 下一段直接复用同一状态、不经过 idel；每段的起点取当前实测末端位姿。
  cart_cycle_large:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: cart_move, offset: [0.15, 0.0, 0.0], duration: 3.0}
      - {type: cart_move, offset: [0.0, 0.0, -0.15], duration: 3.0}
      - {type: cart_move, offset: [0.0, 0.0, 0.15], duration: 3.0}
      - {type: cart_move, offset: [-0.15, 0.0, 0.0], duration: 3.0}
      - {type: idel}

  # **反例（结构不可达）**：沿 +Y 平移 5 cm。
  #
  # 4 轴臂的 y 方向工作空间只有约 4 cm 厚（joint1/joint2 是绕 y 的平面 2R，
  # joint3 的力臂只有 0.047 m），沿 y 平移 5 cm 在物理上出不去。ik_solve 实测：
  # 最近可达位姿仍差 **3.7e-2 m**，远大于 1e-3 m 判据，控制器在下发前拒绝。
  #
  # 这条替换了 6 轴时期的「+Z 抬升 5 cm」：+Z 在 4 维任务空间里是**可达**的
  # （离线实测残余 3.2e-5 m），不再能当反例。
  unreachable_near:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: cart_move, offset: [0.0, 0.05, 0.0], duration: 2.0}
      - {type: idel}

  # **反例**：从 ready 位姿沿 +X 平移 2 m，远远超出工作空间（最大臂展约 0.82 m）。
  # ik_solve 实测残余 1.215 m。控制器在下发前拒绝，完全不运动（docs/bugs.md O2 的语义）。
  unreachable_far:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: cart_move, offset: [2.0, 0.0, 0.0], duration: 2.0}
      - {type: idel}

  # 交互式关节运动：起好之后在**终端**里逐轮输入目标位姿。
  #
  #   ros2 run tasks task_runner --ros-args -p use_sim_time:=true -p task_sequence:="joint_console_only"
  #
  # 注意：终端版必须用 ros2 run（需要把当前终端 stdin 接到 task_runner）；用 launch 启动时
  # 节点没有交互 stdin，会立即看到 EOF 并结束步骤。窗口版见下面的 joint_console_ui。
  #
  # **逐项输入**，一次只敲一个数：先 6 个关节角（度），再 1 个执行时间（秒；
  # 直接回车用本步骤的 duration，本步骤没写则用参数 console_default_duration，默认 3 s）。
  # 输入途中直接回车 = 取消本组重来，exit 结束步骤；运动中输入 stop 立即切回 idel
  # 并在当前位置保持（下一轮输入会自动重新进入 joint_traj）。
  # 每个角度先过 joint_limits 与单步幅度校验，超限只提示重输，不会下发。
  #
  # 刻意不加前置 reset：复位会把机械臂甩回零位，而本任务的意义就是从当前位置自由试位姿。
  joint_console_only:
    steps:
      - {type: joint_console, duration: 3.0}
      - {type: idel}

  # Qt UI 版：同一套 joint_console 校验/下发逻辑，只是把逐项终端输入换成窗口。
  # 需要图形会话（DISPLAY 或 WAYLAND_DISPLAY）；无显示时步骤会失败并提示改用终端版。
  # 推荐用一条龙 launch（默认序列就是它）：
  #   ros2 launch launch_pack arm_task_sim.launch.py
  # 也可以单独起 task_runner：
  #   ros2 run tasks task_runner --ros-args -p use_sim_time:=true -p task_sequence:="joint_console_ui"
  # 窗口里 6 个目标角度（度）+ 执行时间；Execute 下发，Stop 切 idel 就地保持，
  # Exit 结束；输入框里按 Enter 等同 Execute。
  joint_console_ui:
    steps:
      - {type: joint_console, ui: true, duration: 3.0}
      - {type: idel}

  # pos_move 的正向验收：从 ready 向下 5 cm。仿真实测位置残差 0.0009 m
  # （< 1 mm 判据），姿态漂移被量测并写进日志——说明姿态确实不参与收敛，
  # 位置仍按纯米数判据到位。
  pos_move_demo:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: pos_move, to: below_ready_5cm, duration: 2.0}
      - {type: idel}

  # **反例，预期失败**：+Z 5 cm。这条最初想用来做「6 维不可达 → position-only 可达」
  # 的 A/B 正向对照，仿真实测把它证伪了：6 维下残余 1.045997e-3（临界不可达），
  # position-only 下残余 0.031 m 仍然不可达（最近可达位置约在起点上方 1.9 cm）。
  # 结论：放松姿态能放宽「位置+姿态组合」约束，但**不能突破连杆长度与关节限位
  # 决定的高度上限**。别拿它当可达集扩大的证据；退出码 1 是正确行为。
  pos_move_near:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: pos_move, to: above_ready_5cm, duration: 2.0}
      - {type: idel}

  # 也可以不引用命名点，直接给基座系坐标（这里同样是向下 5 cm，已仿真验证通过）；
  # max_drift_deg 覆盖默认告警阈值。
  pos_move_direct:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: pos_move, position: [-0.147874, -0.015725, 1.182796], duration: 2.0, max_drift_deg: 15.0}
      - {type: idel}

  # pos_move 的工具轴约束演示（orientation 字段）：
  #   1) ready -> below_ready_5cm，四元数取 ready 姿态 -> 只动位置、工具方向不变；
  #   2) below_ready_5cm -> ready_pos，目标 z 轴从 ready 方向再抬高 15°
  #      （[-0.0183, 0, 0, 0.99983] 的 z 轴 = [0, 0.0366, 0.9993]）。
  # 两个目标都已用 ik_solve --axis 离线验证（5 维模式收敛，位置残余 < 1e-4 m）。
  pos_axis_demo:
    steps:
      - {type: reset}
      - {type: joint_move, to: ready, duration: 3.0}
      - {type: pos_move, to: below_ready_5cm, orientation: [0.0, 0.148650700, 0.988889766, 0.000000546], duration: 2.0}
      - {type: pos_move, to: ready_pos, orientation: [-0.018302957, 0.0, 0.0, 0.999832487], duration: 2.0}
      - {type: idel}

  # box_move 演示：需要视觉场景（仿真相机 + 红色箱子）。
  # 抬高场景（scene_vision_raised.xml）里 5D 目标可达；先用 joint_move 到
  # above_box 做粗定位，再由 box_move 走最后约 10 cm（4 轴下只控位置）并读取 TF 修正。
  box_move_demo:
    steps:
      - {type: reset}
      - {type: joint_move, to: above_box, duration: 4.0}
      - {type: box_move, duration: 2.0}
      - {type: idel}

  # 低处回退验证：原 scene_vision.xml（箱体/相机 z≈0.175）。
  # 4 轴下 box_move 恒为 position-only；低处目标已接近该臂
  # 的实际可达边界，实测残差约 1.2 cm，所以这里把位置容差放宽到 2 cm。
  # 若位置也超出容差，步骤会失败（退出码 1），日志里能看到回退原因和残差。
  box_move_low:
    steps:
      - {type: reset}
      - {type: joint_move, to: above_box, duration: 6.0}
      - {type: box_move, duration: 4.0, tolerance: 0.02}
      - {type: idel}
