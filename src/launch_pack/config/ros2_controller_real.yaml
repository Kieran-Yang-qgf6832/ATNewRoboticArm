# 实机差异覆盖配置。
#
# 与 ros2_controller.yaml **叠加**加载：本文件只写实机与仿真的不同项，
# 其余参数（状态机、measure、导纳等）沿用仿真那份的默认值。
# 启动方式见 launch_pack/launch/arm_real.launch.py。

controller_manager:
  ros__parameters:
    # 100 Hz：write() 里是同步 USB bulk 发送（超时 2 ms），200 Hz 时一个周期只有 5 ms，
    # 一次 USB 抖动就能吃满整个控制周期并把 controller_manager 拖到超时。
    # 固件内环是 1 ms，100 Hz 的设定点足够平滑。
    update_rate: 100

arm_controller:
  ros__parameters:
    # 硬件接口的命令键是 <joint>/<interface>，**不带** <ros2_control name> 前缀；
    # 只有链式控制器（仿真里的 sim_pid_controller）才需要前缀。
    command_interface_prefix: ""

    # 实机标志：teach_pendant / measure 在实机上物理不成立（MCU 不接收阻抗增益、
    # 不上报加速度，joint6 无电机），这两个状态会被拒绝切入。
    real_mode: true

    # 实机只有 5 个自由度：joint6 无电机、机械锁死。
    # 5 维任务 = 位置 3 + 工具指向 2，绕工具轴的滚转不参与求解。
    task_dim: 5

    # 首次上电只锁住上电姿态，不做自动复位——臂可能停在任意位置。
    exp_state: idel

    # 固件不接收 kp/kd/ki（它跑自己的位置/速度双环 PID，增益硬编码在固件里），
    # 这三个值只用来满足 ros2_control 的命令接口，不产生任何效果。
    default_kp: [40.0, 40.0, 40.0, 2.0, 2.0, 0.2]
    default_kd: [1.6, 1.6, 1.6, 0.08, 0.04, 0.01]

    # 重力前馈先关掉：下发力矩会被固件直接叠加到速度环输出上（固件侧没有限幅），
    # 而 URDF 的质量/惯量只在仿真里辨识过、没在实机核过符号。
    # 等通信、标定与基本运动都确认无误后，再把 gravity_compensation 打开并从 0.1 起加。
    gravity_compensation: false
    gravity_compensation_scale: 0.1

    # 实机不支持 measure：MCU 不上报加速度，acc_* 列恒为 0，辨识结果不可用。
    # 需要参数辨识请回仿真链路。
