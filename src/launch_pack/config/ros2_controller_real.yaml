# 实机差异覆盖配置。
#
# 与 ros2_controller.yaml **叠加**加载：本文件只写实机与仿真的不同项，
# 其余参数（状态机、measure、导纳等）沿用仿真那份的默认值。
# 启动方式见 launch_pack/launch/arm_real.launch.py。

controller_manager:
  ros__parameters:
    # 100 Hz：write() 里是同步 USB bulk 发送（超时 2 ms），200 Hz 时一个周期只有 5 ms，
    # 一次 USB 抖动就能吃满整个控制周期并把 controller_manager 拖到超时。
    # 固件内环是 1 ms，100 Hz 的设定点足够平滑。
    update_rate: 100

arm_controller:
  ros__parameters:
    # 硬件接口的命令键是 <joint>/<interface>，**不带** <ros2_control name> 前缀；
    # 只有链式控制器（仿真里的 sim_pid_controller）才需要前缀。
    command_interface_prefix: ""

    # 实机标志：teach_pendant 在实机上物理不成立（MCU 不接收阻抗增益，kp=0 的纯阻尼
    # 环做不出来），会被拒绝切入。measure **可用**：辨识已改成分部积分滤波回归量，
    # 只吃 q/q̇/τ，不依赖关节加速度；CSV 也不再写 acc_* 列。
    real_mode: true

    # 实机只有 5 个自由度：joint6 无电机、机械锁死。激励轨迹把 joint6 冻结在当前位形，
    # 优化维度里只含 joint1~joint5。
    measure_frozen_joints: [joint6]

    # 实机只有 5 个自由度：joint6 无电机、机械锁死。
    # 5 维任务 = 位置 3 + 工具指向 2，绕工具轴的滚转不参与求解。
    task_dim: 5

    # 首次上电只锁住上电姿态，不做自动复位——臂可能停在任意位置。
    exp_state: idel

    # 固件不接收 kp/kd/ki（它跑自己的位置/速度双环 PID，增益硬编码在固件里），
    # 这三个值只用来满足 ros2_control 的命令接口，不产生任何效果。
    default_kp: [40.0, 40.0, 40.0, 2.0, 2.0, 0.2]
    default_kd: [1.6, 1.6, 1.6, 0.08, 0.04, 0.01]

    # 重力前馈先关掉：下发力矩会被固件直接叠加到速度环输出上（固件侧没有限幅），
    # 而 URDF 的质量/惯量只在仿真里辨识过、没在实机核过符号。
    # 等通信、标定与基本运动都确认无误后，再把 gravity_compensation 打开并从 0.1 起加。
    gravity_compensation: false
    gravity_compensation_scale: 0.1

    # 实机上的参数辨识：先跑 measure 录 q/q̇/τ（MCU 报文 50 Hz，控制器 100 Hz 逐拍落盘，
    # 相邻两行是同一帧报文的重复，不影响最小二乘），再用 parameter_identify 离线辨识。
    # 验证集要**另录一条**不同 seed 的激励轨迹（measure_trajectory_seed 换个数即可）。
    # 录出来的 CSV 没有 acc_* 列——辨识链路不再需要加速度。
    #
    # 注意 measure_record_sample_rate 只用来**算记录缓冲区大小**（不控制落盘频率），
    # 实机 100 Hz 控制下必须按 100 Hz 以上估容量，不要按 50 去填，否则会写满丢样本。

    # ---- 激励轨迹形状与生成成本 ----
    # 下面四项与 ros2_controller.yaml 的值相同，显式写出来只为把「实机可单独收紧」这件事
    # 放在实机配置里可见的位置（叠加加载，改这里只影响实机）。都只在构造期读取，改完重启。
    # 实机首测若担心关节5（行程 ±0.611 rad）或撞限位，可先把软限位比例降到 0.5；
    # 实机激励目标是「力矩幅值够大、又不超额定」，不是把幅度拉到最大。
    measure_traj_pos_soft_limit_rate: 0.7
    # 速度上限比例（× URDF velocityLimit）。实机真正的速度上限在 MCU 固件内环里，
    # 这里只约束生成阶段：压到 0.5 会让激励轨迹更慢更平缓，也更容易被判可跟踪。
    measure_traj_vel_limit_rate: 1.0
    # 傅里叶谐波数。实机 100 Hz 控制 + 50 Hz 报文，高频成分跟踪不出来，
    # 建议不要超过 3（默认值）。
    measure_traj_harmonics: 3
    # CMA-ES 评估次数，决定生成耗时（1500 ≈ 本机 53 s @ T=10、106 s @ T>=20）。
    # 实机同样受任务层 step_timeout 约束：arm_real.launch.py 不启动 task_runner，
    # 手动跑时自己传（建议 300 s 起，T>=20 s 的生成段约 106 s）。
    measure_traj_max_fevals: 1500
