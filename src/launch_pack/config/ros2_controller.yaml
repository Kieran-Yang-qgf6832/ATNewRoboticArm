# ============================================================================
# 当前生效模型：4 自由度机械臂（src/arm_model/model）。
# 6 自由度模型保存在 Git 历史（commit 5e59ef5）；下面注释里 joint5/joint6、
# link6 工具网格、0.124 rad 静差等数值都是 6 自由度时期整定的，切换后仅作参考，
# 需要按 4 自由度模型重新实测。
# ============================================================================
controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    sim_pid_controller:
      type: arm_controller/SimPidController

    arm_controller:
      type: arm_controller/ArmController

sim_pid_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
    urdf_path: ""
    # 末端执行器坐标系：4 自由度模型的最后一节是 link4；6 自由度模型是 link6。
    # controller 的 FK/雅可比、measure 激励轨迹、任务层 TF 查询都读这个参数。
    end_effector_frame: link4
    # 任务空间维度（docs/bugs.md O13）：4 = (x, y, z, joint4 自转)，6 = (x, y, z, 旋转向量)。
    # 4 轴臂的 6 维几何雅可比秩恒为 4，用 6 维任务空间时笛卡尔目标必然不可达——
    # 实测把 6 维目标做最小二乘「尽力而为」会让 pick_demo 的位置误差达到 28.6 mm。
    # 换回 6 自由度模型时把这里改成 6（同时 end_effector_frame 改回 link6）。
    # 初始化后不可修改（映射与求解器已按维度构造），实际生效值见控制器启动日志。
    task_space_dof: 4
    command_interface_prefix: sim_pid_controller
    # 控制器激活后自动进入的状态。
    # 设为 reset：上电（激活）后先自动复位到 reset_joint_pos，复位完成时 ResetState
    # 会把内部期望状态写回 idel，于是自动回到空闲并锁定零位——即"先 reset 再 idel"。
    # 复位起点是激活那一刻的实际关节角（仿真启动到激活之间无人保持、臂可能下垂，自动复位
    # 正好把它拉回零位）；复位时长/目标/容差由下面的 reset_duration / reset_joint_pos /
    # reset_tolerance 决定。若不想自动复位，改回 idel 即可。
    exp_state: reset
    # 4 自由度模型的阻抗初值——**不能照搬 6 自由度或 MJCF 位置伺服的增益**：
    #   · 6 自由度的 kp 200/800 依赖大得多的连杆惯量；MuJoCo 的 <position kp> 是隐式
    #     伺服，而本项目走 500 Hz 显式力矩环（SimPidController），稳定域由 I/dt²、I/dt 决定。
    #   · joint3 的等效惯量只有约 2e-4 kg·m²，显式阻尼的稳定上界 kd < 2I/dt ≈ 0.2；
    #     kd 取 0.5 时会在 500 Hz 下出现 2 步一翻转的数值振荡（实测）。
    #   · joint1（肩）在 bent 位姿下的重力 Hessian 特征值约 -6.4，kp 必须大于它才能
    #     让重力前馈（按**期望**位姿算）下的跟踪误差收敛；取 15 留出裕量。
    # 下面这组值经 MuJoCo 闭环仿真与实跑验证：复位收敛、reset_then_joint 跟踪误差
    # 0.0000 rad。改动前建议先用同样的闭环仿真复核（尤其是 kd3）。
    default_kp: [15.0, 20.0, 3.0, 3.0]
    default_kd: [1.2, 2.0, 0.1, 0.3]
    # 所有保持路径的重力前馈补偿（docs/bugs.md O6 / O7）：reset / idel 与
    # write_hold_command()（cart_traj / joint_traj / admittance 的保持阶段）共用
    # HoldGravityFeedforward（arm_fsm.hpp）。
    # 关闭时只用 default_kp 保持：零位姿下 joint4 的重力静差约 0.124 rad，远超
    # reset_tolerance，复位会一直不达标并静默回退 idel，最终停在偏离零位约 12.4° 的位置；
    # cart_traj 等状态在等待轨迹到达的约 0.9 s 里 joint4 还会塌陷约 0.089 rad，
    # 笛卡尔运动的起点因此不是指令要求的位姿（实测末端 x 由 -0.148 偏到 -0.185）。
    # 打开时用 RNEA 在 dq = ddq = 0 下算出重力力矩作为力矩前馈，静差被直接补掉。
    # 这是实机上唯一一处主动输出力矩的保持路径，怀疑模型质量或力矩符号时先关掉它。
    gravity_compensation: true
    reset_joint_pos: [0.0, 0.0, 0.0, 0.0]
    reset_duration: 3.0
    reset_tolerance: 0.01
    # 兜底：复位时长结束后再等这么久仍未全部到位（例如重力静差大于容差），打一条
    # WARN 并强制切回 idel，避免 FSM 卡在 reset 静默吞掉后续 exp_state 请求。
    # 任务层的 reset 步骤会一直等到 current_state 变成 idel，所以这个值直接加在任务的等待
    # 时间上（reset_duration + reset_settle），不宜过大；也不能大到超过任务层的 step_timeout
    # （默认 30 s，见 task_executor.hpp）。
    reset_settle: 2.0
    measure_trajectory_period: 10.0
    measure_move_to_start_duration: 3.0
    measure_trajectory_repeat_cnt: 1
    # 辨识测量 CSV 的输出路径。相对路径按启动进程的工作目录解析。
    # 通过 launch_pack/arm_measure_sim.launch.py 启动时，launch 会把它覆盖成
    # <项目根目录>/measured_for_identification.csv 的绝对路径（不再写 /tmp）。
    # 控制器在**构造阶段**读这个参数，只改这里必须重启控制器才生效（docs/bugs.md C6）。
    measure_csv_file_path: measured_for_identification.csv
    measure_record_sample_rate: 500.0
    # 激励轨迹 CMA-ES 的随机种子（docs/bugs.md O10）。0 = 每次按当前时间随机，
    # 生成的轨迹**不可复现**；填任意正整数即可复现同一条轨迹——控制器日志里的
    # "seed=" 会打出实际使用的值，照抄回来即可重放某一次测量。
    measure_trajectory_seed: 0
    # 导纳参数（docs/bugs.md O14）：4 轴模型下 admittance 已可用，长度按 task_space_dof
    # 取前 4 维 = [x, y, z, joint4 自转]（6 轴模型按 6 维用，多出来的项会被忽略）。
    #   · 进入导纳后**没收到 arm_admittance 轨迹**时按自由导纳工作：K 不参与，推着走、
    #     撤力停在原地（速度上限见下面两个 admittance_*_velocity_limit）；
    #     收到轨迹时是「轨迹 + 柔顺」的旧语义（这时 K 会起作用）。
    #   · 质量按 kg、阻尼按 N/(m/s)、刚度按 N/m；第 4 维对应 N·m、N·m/(rad/s)、N·m/rad。
    #   · 这几个参数和下面的限速/死区/滤波都支持 **热更新**（ros2 param set 立刻生效）：
    #     调手感不用重启仿真。长度上限 6，质量必须为正，阻尼/刚度非负。
    admittance_mass: [1.0, 1.0, 1.0, 0.1]
    admittance_damping: [20.0, 20.0, 20.0, 2.0]
    admittance_stiffness: [0.0, 0.0, 0.0, 0.0]
    # 让开速度上限：平移按**速度向量模长**限 0.1 m/s（斜推不会被逐轴截断成只沿一个轴走），
    # 工具自转单独限 0.5 rad/s。没有位移上限——一直推会一直走到工作空间/关节限位，
    # 到边界时控制器回滚到上一拍可行目标并清零速度，**状态保持不退**。
    admittance_velocity_limit: 0.1
    admittance_rotation_velocity_limit: 0.5
    # 力估计死区（平移 N / 自转 N·m）：低于阈值当 0，阈值以上先减掉再进导纳。
    # 必需项——K = 0 时导纳对力是无穷大直流增益，模型偏差（实测参数误差 0.1% 量级）
    # 会被积成肉眼可见的缓慢爬行（0.2 N 的偏差按 D=20 就是 1 cm/s）。
    # 实际阈值应由第 1 步的力估计复测（注入已知外力对比估计值）来标定。
    # 实测（2026-10-18，ready 位形）：静止时原始力估计只有 3e-8 N 量级——URDF 与 MuJoCo
    # 模型同源参数，残差本来就是机器精度。所以 1.5 N 的死区对仿真太保守：2 N 的轻推会被
    # 全部吃掉。这里取 0.5 N / 0.05 N·m，留一点余量给实机上的模型偏差。
    admittance_force_deadband: 0.5
    admittance_torque_deadband: 0.05
    # 力估计的一阶低通截止频率（Hz），0 = 关闭。残差里剩下的高频成分来自模型误差，
    # 抹掉它比加大阻尼更不影响手感（10 Hz 在 500 Hz 下约 16 ms 滞后）。
    admittance_force_filter_cutoff: 10.0
    # 力估计上限（N / N·m）：近奇异位形（例如零位形完全伸直时 z 方向不可控）下
    # 「τ = Jᵀ·F」的最小二乘解会被 1/σ_min 放大——实测零位形进入导纳时被放大到
    # 78 N / 12 N·m，直接把这么大的加速度写进力矩前馈会把机械臂甩到关节限位外。
    # 限幅只作用于进入导纳的那份估计；~/admittance_estimate 里前一半仍是**原始**估计。
    # 演示应当从非奇异位形（ready）进入导纳，零位形只用于兜底。
    admittance_force_limit: 20.0
    admittance_torque_limit: 3.0
    measure_end_effector_x_lower_limit: -.inf
    measure_end_effector_x_upper_limit: .inf
    measure_end_effector_y_lower_limit: -.inf
    measure_end_effector_y_upper_limit: .inf
    # 末端位置箱式约束。注意 **z 下限卡的是"工具最低点"**，不是末端 frame 原点：
    # 实际值 = 末端原点 z - measure_end_effector_tool_offset。
    # 实测（2026-10-13，6 自由度时期）：只卡原点 z>=0.1 时 link6 的工具网格会钻进地面 4.6 mm，
    # MuJoCo 的地面接触冲量让模型残差出现 81.9 N·m 的尖峰（每个激励周期一次），
    # 而 URDF 里没有地面，无法解释——辨识数据因此报废。
    #
    # O12（2026-10-17）：地面净空现在由下面的 measure_traj_ground_clearance 直接卡在
    # **每个连杆网格的最低点**上，因此这里默认关闭（-.inf），把激励空间还给碰撞约束。
    # 保留这两个参数作 O11 的回归基准与逃生开关：想回到旧的单点约束，把 z 下限设回 0.20 即可。
    measure_end_effector_z_lower_limit: -.inf
    measure_end_effector_z_upper_limit: .inf
    # 工具最低点相对末端 frame 原点的偏移（沿 -z，米）。0.07 是 6 自由度 link6 的
    # 实测值（0.0569 m 加余量），4 自由度下需要重新确认；实际生效值见控制器日志
    # "激励约束：" 那一行。
    # 只在 measure_end_effector_z_lower_limit 有限时才有意义（O12 后默认关闭）。
    measure_end_effector_tool_offset: 0.07
    # 指令力矩可行性：RNEA 算出的 |关节力矩| 不得超过 该比例 × 关节额定力矩（URDF 的
    # effort=50 N·m）。0 = 关闭。实机上力矩超限会直接跟踪失败；仿真里关节会被甩到高速，
    # 记录到的 qacc 出现尖峰，辨识数据报废。
    measure_traj_torque_limit_rate: 0.6
    # O12：激励轨迹的碰撞限制（docs/bugs.md O12）。0 = 关闭。
    #   连杆间安全间距：非相邻连杆网格之间的最小距离 >= 该值（米）。相邻连杆对
    #   （joint index 相差 1）被排除，与 MuJoCo scene.xml 的 contact exclude 一致——
    #   它们的网格在关节处本来就互相嵌入，检查它们会让可行域恒为空。
    #   地面净空：每个连杆网格的最低点 >= 该值（米），**base_link 除外**（它的网格本来
    #   就埋在地面下 9.5 mm，仿真里是静态体、不产生接触）。与 measure_end_effector_z_lower_limit
    #   的区别是它卡全部活动连杆（6 自由度时期实测 link4/link5/link6 在部分位形下都会低于 z=0）。
    # 两个值的来历（6 自由度时期）：1000 个均匀随机位形里，从不碰撞的几对中 p5 分位最小
    # 约 0.028 m（link3↔link5）、p1 分位 0.021 m；20 mm 会切掉一小部分极端位形但不伤主体
    # 激励空间。4 自由度模型的连杆更少，建议重新跑一遍 check_collision.py 确认。
    # 地面留 10 mm 是给 MuJoCo 接触容忍度留余量。
    # 改完记得看日志 "激励约束：" 行确认实际生效值。
    # 4 自由度模型的连杆间碰撞约束**默认关闭**：它的 base_link 网格 5.0 MB（6 自由度
    # 是 0.7 MB），且 AABB 与整条臂长期重叠，coal 的 mesh-mesh 距离查询让激励轨迹生成
    # 从 ~50 s 恶化到 >4.5 min（2026-10-17 实测 240 s 超时、600 s 仍未完成）。
    # 地面净空 measure_traj_ground_clearance 仍然开启（平面距离查询很便宜）。
    # 网格简化或把 base_link 从碰撞对里排除后，可以把它恢复成 0.02。
    measure_traj_collision_safe_distance: 0.0
    measure_traj_ground_clearance: 0.01
