model:
  # 当前生效模型是 4 自由度（src/arm_model/model）。必须与 URDF 和测量 CSV 的关节数一致；
  # 换回 6 轴模型时改成 joint1..joint6。
  active_joints: [joint1, joint2, joint3, joint4]

data:
  # 必须与 CSV 实际采样周期一致。实测 CSV 是 500 Hz（0.002），原来写的 0.02（50 Hz）差了 10 倍。
  # 当前链路不读它（build_regressor_basic / QRDecomposer 都不读 ts），但 vendored FIGAROH 的
  # 滤波工具会读（cutoff = ts * cut_off_frequency_butterworth / 2），一旦启用就会静默出错。
  sample_time: 0.002
  decimate: false
  decimation_factor: 10
  max_samples: 0
  # recorded：直接用 CSV 里的 acc_* 列（measure 记录的 MuJoCo 真实 qacc，docs/bugs.md O8）。
  # 旧 CSV 没有 acc_* 列时会**显式报错**，不会静默退回求导——那时请显式改成 computed。
  # computed：对 vel_* 做 Savitzky-Golay 平滑再求导，实测相对误差 ~31%，会把辨识结果
  #           推出物理可行集，只在拿不到真实加速度时用。
  acceleration_source: recorded
  acceleration_smoothing_window: 11
  acceleration_smoothing_polyorder: 3

identification:
  zero_tolerance: 1.0e-8
  qr_tolerance: 1.0e-8
  weighted_least_squares: false
  has_friction: false
  has_actuator_inertia: false
  has_joint_offset: false

reconstruction:
  enabled: true
  # auto：装了 picos 走 sdp，没装退回 nullspace。
  #
  # 2026-10-13 更新（docs/bugs.md O8 修复后）：测量已经记录**真实加速度**，残差从 31.5%
  # 降到 0.37%，辨识参数与真值只差 0.83%。但 sdp 仍会判不可行——**不是数据错**，而是这台
  # 机器人的真值模型本身就贴在物理可行集边界上，任何估计误差都会把最小二乘解推到
  # 可行集之外。
  # 所以默认打开 physical_projection：LMI 投影把它拉回可行集内，实测投影后与真值差 1.6%，
  # **不会**退化成质点（旧数据下才会）。投影成功且物理校验通过时不再报错。
  method: auto
  prior_source: urdf
  physical_projection: true
  # 下面这几组开关（strict_base_constraints / base_residual_weight / shape_prior /
  # central_moment_prior / tensor_trust_region）是**更新版 FIGAROH** 才有的；本仓库 vendored
  # 的是 0.6.0，重建入口不接受它们。identify_arm 会按实际签名裁剪、打 WARN，并记进报告的
  # inactive_reconstruction_options——即"配了但当前不生效"，升级 figaroh 后自动启用。
  strict_base_constraints: false
  base_residual_weight: 1.0e6
  mass_min: 1.0e-3
  projection_psd_floor: 1.0e-9
  psd_eig_tol: 1.0e-9
  # 校验容差（负值 = 允许的最小特征值，绝对值是容差）。
  # 4 轴模型的 joint3 等效惯量只有 ~2e-4 kg·m²，LMI 投影求解器噪声可到 ~3e-9；
  # 原来 -1e-9 会把「投影成功、只是数值噪声」误判成非物理（2026-10-19 实测）。
  # 未投影的真实违反量是 1e-2 量级，放宽到 1e-8 仍能拦住。
  inertia_eig_tol: -1.0e-8
  solver: cvxopt
  max_seconds:
  require_physical: true
  prior_weights:
    enabled: true
    normalize_mass: true
    mass_reference_floor: 1.0e-3
    weights:
      mass: 400.0
      first_moment: 10.0
      inertia_diagonal: 50.0
      inertia_offdiagonal: 50.0
  shape_prior:
    enabled: true
    length_scale_min: 0.5
    length_scale_max: 2.0
    min_length_abs: 0.0
  central_moment_prior:
    enabled: true
    weight: 200.0
    diagonal_weight: 1.0
    offdiagonal_weight: 4.0
    min_scale: 1.0e-5
  tensor_trust_region:
    enabled: true
    diagonal_scale_min: 0.8
    diagonal_scale_max: 1.3
    diagonal_abs_margin: 0.0
    offdiag_abs_margin: 0.0
    offdiag_rel_margin: 0.5
    offdiag_diag_fraction: 0.01
    linearized_com_offdiagonal: true
    com_offdiag_abs_margin: 0.0
    com_offdiag_rel_margin: 0.5
    com_offdiag_diag_fraction: 0.01
  cad_constraints:
    source: urdf
    mass_scale_min: 0.8
    mass_scale_max: 1.2
    com_margin_abs: 0.002
    com_margin_rel: 0.1

output:
  write_report: true
