model:
  active_joints: [joint1, joint2, joint3, joint4, joint5, joint6]

data:
  # 采样步长**不再写死**：identify_arm 从 CSV 的 time 列取中位数（实机 50/100 Hz、仿真
  # 500 Hz 都能自动适配）。这里的值只在时间列不可用（少于 2 个样本）时作为退路。
  sample_time: 0.002
  decimate: false
  decimation_factor: 10
  max_samples: 0
  # recorded：有 acc_* 列就用（仿真的 MuJoCo 真实 qacc，docs/bugs.md O8）。
  #           实机 CSV 没有 acc_* 列（MCU 不上报加速度）时返回 None，**不再报错**——
  #           辨识链路走 filter.enabled 的分部积分滤波回归量，本来就不需要加速度。
  # computed：对 vel_* 做 Savitzky-Golay 平滑再求导，实测相对误差 ~31%，只在 filter.enabled=false
  #           且确实拿不到真实加速度时才用。
  acceleration_source: recorded
  acceleration_smoothing_window: 11
  acceleration_smoothing_polyorder: 3

filter:
  # 不依赖关节加速度的辨识：对回归量与力矩施加同一个一阶低通，再用分部积分把 q̈ 解析消掉。
  # 推导与数值细节见 parameter_identify/filtered_identification.py 的模块 docstring。
  #
  # 打开后 CSV 里的 acc_* 列会被**完全忽略**（只用于诊断），所以实机那几条没有加速度的
  # 测量数据可以直接拿来辨识。
  enabled: true
  # 2 Hz：低于机器人前几阶结构频率，能消掉加速度项的高频成分，又不至于把激励能量滤没。
  cutoff_hz: 2.0
  # 零初值起步的滤波器瞬态：2 Hz 对应时间常数 ~0.08 s，0.5 s > 6 个时间常数，整段丢掉。
  drop_initial_seconds: 0.5
  # 算 Ȧ q̇ 用的方向导数扰动幅度（rad），只影响数值精度。
  finite_difference_step: 1.0e-6
  # 求 L(Ḃ) 的离散格式：
  #   central   —— 离线中心差分（误差 O(dt²)）；仿真无噪声下基参数误差 0.03%，
  #                有噪声 0.2% 采样下 0.5%–1%，是默认值。
  #   identity  —— a_eff·B − a_eff·L(B) 的等价变形，隐含后向差分（O(dt)）。
  #                它会在无噪声数据上留下 ~1% 的模型残差（docs/bugs.md Q6），只留作对照。
  derivative_scheme: central
  # 滤波路径的 QR 秩判据必须比基线更严：q̈ 的信息被搬到低频后，少数参数方向只剩
  # 很弱但非零的响应，1e-8 会把它们当独立列留下（cond_R1 从 1e3 恶化到 1e11，
  # 基参数直接爆炸）。1e-6 实测能把基参数个数恢复到 52–54，与基线一致。
  qr_tolerance: 1.0e-6

identification:
  zero_tolerance: 1.0e-8
  # 基线（filter.enabled=false，直接用 q̈）的秩判据；滤波路径用上面 filter.qr_tolerance。
  qr_tolerance: 1.0e-8
  weighted_least_squares: false
  # 摩擦进线性回归：每关节两列（fv·ω、fs·sign(ω)）+ 偏置一列（off），共 3 列。
  # 实机的减速器摩擦不可忽略，不建模的话残差会被它吃掉一大块。
  has_friction: true
  has_actuator_inertia: false
  has_joint_offset: true

reconstruction:
  enabled: true
  # auto：装了 picos 走 sdp，没装退回 nullspace。
  #
  # 2026-10-13 更新（docs/bugs.md O8 修复后）：测量已经记录**真实加速度**，残差从 31.5%
  # 降到 0.37%，辨识参数与真值只差 0.83%。但 sdp 仍会判不可行——**不是数据错**，而是这台
  # 机器人的真值模型本身就贴在物理可行集边界上（link5 伪惯量最小特征值只有 6.4e-6），
  # 任何估计误差都会把最小二乘解推到可行集之外。
  # 所以默认打开 physical_projection：LMI 投影把它拉回可行集内，实测投影后与真值差 1.6%，
  # **不会**退化成质点（旧数据下才会）。投影成功且物理校验通过时不再报错。
  method: auto
  prior_source: urdf
  physical_projection: true
  # 下面这几组开关（strict_base_constraints / base_residual_weight / shape_prior /
  # central_moment_prior / tensor_trust_region）是**更新版 FIGAROH** 才有的；本仓库 vendored
  # 的是 0.6.0，重建入口不接受它们。identify_arm 会按实际签名裁剪、打 WARN，并记进报告的
  # inactive_reconstruction_options——即"配了但当前不生效"，升级 figaroh 后自动启用。
  strict_base_constraints: false
  base_residual_weight: 1.0e6
  mass_min: 1.0e-3
  projection_psd_floor: 1.0e-9
  psd_eig_tol: 1.0e-9
  inertia_eig_tol: -1.0e-9
  solver: cvxopt
  max_seconds:
  require_physical: true
  prior_weights:
    enabled: true
    normalize_mass: true
    mass_reference_floor: 1.0e-3
    weights:
      mass: 400.0
      first_moment: 10.0
      inertia_diagonal: 50.0
      inertia_offdiagonal: 50.0
  shape_prior:
    enabled: true
    length_scale_min: 0.5
    length_scale_max: 2.0
    min_length_abs: 0.0
  central_moment_prior:
    enabled: true
    weight: 200.0
    diagonal_weight: 1.0
    offdiagonal_weight: 4.0
    min_scale: 1.0e-5
  tensor_trust_region:
    enabled: true
    diagonal_scale_min: 0.8
    diagonal_scale_max: 1.3
    diagonal_abs_margin: 0.0
    offdiag_abs_margin: 0.0
    offdiag_rel_margin: 0.5
    offdiag_diag_fraction: 0.01
    linearized_com_offdiagonal: true
    com_offdiag_abs_margin: 0.0
    com_offdiag_rel_margin: 0.5
    com_offdiag_diag_fraction: 0.01
  cad_constraints:
    source: urdf
    mass_scale_min: 0.8
    mass_scale_max: 1.2
    com_margin_abs: 0.002
    com_margin_rel: 0.1

output:
  write_report: true
