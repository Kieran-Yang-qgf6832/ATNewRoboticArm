model:
  active_joints: [joint1, joint2, joint3, joint4, joint5, joint6]

data:
  # 必须与 CSV 实际采样周期一致。实测 CSV 是 500 Hz（0.002），原来写的 0.02（50 Hz）差了 10 倍。
  # 当前链路不读它（build_regressor_basic / QRDecomposer 都不读 ts），但 vendored FIGAROH 的
  # 滤波工具会读（cutoff = ts * cut_off_frequency_butterworth / 2），一旦启用就会静默出错。
  sample_time: 0.002
  decimate: false
  decimation_factor: 10
  max_samples: 0
  acceleration_source: computed
  acceleration_smoothing_window: 11
  acceleration_smoothing_polyorder: 3

identification:
  zero_tolerance: 1.0e-8
  qr_tolerance: 1.0e-8
  weighted_least_squares: false
  has_friction: false
  has_actuator_inertia: false
  has_joint_offset: false

reconstruction:
  enabled: true
  # auto：装了 picos 走 sdp，没装退回 nullspace。
  # 本项目**当前这份测量数据**用 sdp 会判定不可行（辨识出的基参数 phi_base 距物理可行集
  # 约 0.37，而 ‖phi_base‖≈1.98；只留 PSD 可行、只留等式可行、两者同时不可行），
  # 根因已定位：辨识用的**加速度**由 500 Hz 记录速度二次求导得到，相对误差 31.5%
  # （模型与力矩都验证无误——反解加速度满足 ‖M·a + bias − τ‖ = 1.4e-16，详见 docs/bugs.md O8）。
  # 所以这里保持"失败就报错"，不静默降级。
  # 想强行拿到一个物理可行的模型可以改成 method: nullspace + physical_projection: true，
  # 但实测那样会把连杆投影成质点（惯量从 1e-3 塌到 1e-10），不是可用模型——详见 README。
  method: auto
  prior_source: urdf
  physical_projection: false
  # 下面这几组开关（strict_base_constraints / base_residual_weight / shape_prior /
  # central_moment_prior / tensor_trust_region）是**更新版 FIGAROH** 才有的；本仓库 vendored
  # 的是 0.6.0，重建入口不接受它们。identify_arm 会按实际签名裁剪、打 WARN，并记进报告的
  # inactive_reconstruction_options——即"配了但当前不生效"，升级 figaroh 后自动启用。
  strict_base_constraints: false
  base_residual_weight: 1.0e6
  mass_min: 1.0e-3
  projection_psd_floor: 1.0e-9
  psd_eig_tol: 1.0e-9
  inertia_eig_tol: -1.0e-9
  solver: cvxopt
  max_seconds:
  require_physical: true
  prior_weights:
    enabled: true
    normalize_mass: true
    mass_reference_floor: 1.0e-3
    weights:
      mass: 400.0
      first_moment: 10.0
      inertia_diagonal: 50.0
      inertia_offdiagonal: 50.0
  shape_prior:
    enabled: true
    length_scale_min: 0.5
    length_scale_max: 2.0
    min_length_abs: 0.0
  central_moment_prior:
    enabled: true
    weight: 200.0
    diagonal_weight: 1.0
    offdiagonal_weight: 4.0
    min_scale: 1.0e-5
  tensor_trust_region:
    enabled: true
    diagonal_scale_min: 0.8
    diagonal_scale_max: 1.3
    diagonal_abs_margin: 0.0
    offdiag_abs_margin: 0.0
    offdiag_rel_margin: 0.5
    offdiag_diag_fraction: 0.01
    linearized_com_offdiagonal: true
    com_offdiag_abs_margin: 0.0
    com_offdiag_rel_margin: 0.5
    com_offdiag_diag_fraction: 0.01
  cad_constraints:
    source: urdf
    mass_scale_min: 0.8
    mass_scale_max: 1.2
    com_margin_abs: 0.002
    com_margin_rel: 0.1

output:
  write_report: true
